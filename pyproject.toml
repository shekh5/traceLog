[project]
name = "tracelog"
version = "0.1.0"
description = "TraceLog - a GPT-5.6 reliability supervisor for production AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # GPT-5.6 reasoning core (Responses API + Pydantic structured outputs)
    "openai>=2.49.0",
    # Phoenix MCP integration
    "mcp>=2.0.0",                     # Model Context Protocol client for @arizeai/phoenix-mcp
    # The Patient instrumentation
    "openinference-instrumentation>=0.1.54",
    # TraceLog's own self-tracing into the tracelog-meta project (instrumentation.py)
    "openinference-instrumentation-openai>=0.1.52",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    # Dashboard
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "sse-starlette>=3.4.6",
    # State + infra
    "google-cloud-firestore>=2.28.0",
    "google-cloud-secret-manager>=2.30.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
]

[project.scripts]
# TraceLog's own MCP server — publishes the supervision tools over stdio so any
# agent/IDE (Claude Desktop, Cursor) can call them.
tracelog-mcp = "tracelog.mcp_server:main"
# CI prompt regression gate — fails the build when a prompt edit drops the pass rate.
tracelog-gate = "tracelog.gate:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["patient", "tracelog", "dashboard"]
