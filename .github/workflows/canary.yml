name: Deployment canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  health:
    name: Production health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check configured deployment
        env:
          PATIENT_BASE_URL: ${{ vars.TRACELOG_PATIENT_URL }}
          DASHBOARD_BASE_URL: ${{ vars.TRACELOG_DASHBOARD_URL }}
        run: |
          if [[ -z "$PATIENT_BASE_URL" || -z "$DASHBOARD_BASE_URL" ]]; then
            echo "Configure TRACELOG_PATIENT_URL and TRACELOG_DASHBOARD_URL repository variables."
            exit 1
          fi
          scripts/smoke_test.sh "$PATIENT_BASE_URL" "$DASHBOARD_BASE_URL"
